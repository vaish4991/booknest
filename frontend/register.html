<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register — BookNest</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

  <!-- Navigation Bar -->
  <nav id="main-nav" class="navbar"></nav>

  <div class="auth-container">
    <div class="auth-card" style="max-width: 500px;">
      <div class="auth-header">
        <h2>Create Account</h2>
        <p>Join BookNest and start your reading journey</p>
      </div>

      <form id="register-form">
        <div class="form-group">
          <label for="reg-name">Full Name</label>
          <input type="text" id="reg-name" placeholder="John Doe" required>
        </div>

        <div class="form-group">
          <label for="reg-email">Email Address</label>
          <input type="email" id="reg-email" placeholder="john@example.com" required>
        </div>

        <div class="form-group">
          <label for="reg-mobile">Mobile Number</label>
          <input type="tel" id="reg-mobile" placeholder="10-digit mobile number" pattern="[0-9]{10}" title="Ten digit mobile number without spaces or country code" required>
        </div>

        <div class="form-group">
          <label for="reg-password">Password</label>
          <input type="password" id="reg-password" placeholder="Minimum 6 characters" minlength="6" required>
        </div>

        <div class="form-group">
          <label for="reg-confirm-password">Confirm Password</label>
          <input type="password" id="reg-confirm-password" placeholder="Re-enter password" minlength="6" required>
        </div>

        <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 8px;">Register</button>
      </form>

      <div class="auth-footer">
        Already have an account? <a href="/login.html">Login Here</a>
      </div>
    </div>
  </div>

  <!-- Footer -->
  <footer id="main-footer"></footer>

  <!-- Scripts -->
  <script src="/js/utils.js"></script>
  <script src="/js/auth.js"></script>
</body>
</html>
