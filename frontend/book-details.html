<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Book Details — BookNest</title>
  <meta name="description" content="Read reviews, description, and specs of books on BookNest. Order online with quick checkout.">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

  <!-- Navigation Bar -->
  <nav id="main-nav" class="navbar"></nav>

  <div class="details-container">
    <div class="details-grid" id="details-loader">
      <div class="empty-state" style="grid-column: 1 / -1; border: none; box-shadow: none;">
        <i class="fas fa-spinner fa-spin" style="font-size: 40px; color: var(--primary);"></i>
        <p>Fetching book details...</p>
      </div>
    </div>

    <!-- Details View (Initially hidden, rendered via JS) -->
    <div id="details-view" style="display: none;">
      <div class="details-grid">
        <div class="details-cover">
          <img id="book-cover" src="" alt="Book Cover">
        </div>
        <div class="details-info">
          <div class="book-card-category" id="book-category">CATEGORY</div>
          <h1 class="details-title" id="book-title">Book Title</h1>
          <div class="details-author" id="book-author">by Author Name</div>
          
          <div class="details-rating">
            <span class="rating-stars" id="book-stars"></span>
            <span id="book-review-count" style="font-size: 14px; color: var(--text-muted);">0 reviews</span>
          </div>

          <div class="details-price-card">
            <div class="details-price-row">
              <span class="price" id="book-price">₹0</span>
              <span class="price-original" id="book-original-price">₹0</span>
              <span id="book-discount-badge" class="discount-badge" style="position:static;">-0%</span>
            </div>
            <div>
              <span id="book-stock-status" class="stock-status">In Stock</span>
            </div>
          </div>

          <p id="book-description" style="color: var(--text-muted); margin-bottom: 24px; font-size: 15px; line-height: 1.6;"></p>

          <div class="quantity-picker">
            <button id="qty-minus" type="button"><i class="fas fa-minus"></i></button>
            <input type="text" id="qty-input" value="1" readonly>
            <button id="qty-plus" type="button"><i class="fas fa-plus"></i></button>
          </div>

          <div class="details-actions">
            <button class="btn btn-primary" id="btn-add-to-cart" style="flex: 1;"><i class="fas fa-shopping-cart"></i> Add to Cart</button>
            <button class="btn btn-secondary" id="btn-buy-now" style="flex: 1;"><i class="fas fa-bolt"></i> Buy Now</button>
          </div>

          <div class="details-specs">
            <span><strong>Publisher:</strong> <span id="book-publisher">Publisher</span></span>
            <span><strong>ISBN-13:</strong> <span id="book-isbn">ISBN</span></span>
          </div>
        </div>
      </div>

      <!-- Reviews Section -->
      <div class="reviews-section">
        <h2 class="section-title">Customer Reviews</h2>
        
        <div class="reviews-grid">
          <!-- Reviews list -->
          <div class="reviews-list-container">
            <div class="reviews-list" id="reviews-list">
              <!-- Rendered via JS -->
            </div>
          </div>

          <!-- Add Review form -->
          <div class="review-form" id="review-form-container">
            <h3 style="font-size: 18px; font-weight: 700; margin-bottom: 16px;">Write a Customer Review</h3>
            <form id="submit-review-form">
              <div class="form-group">
                <label>Overall Rating</label>
                <div class="rating-select" id="rating-select-stars">
                  <i class="fas fa-star" data-rating="1"></i>
                  <i class="fas fa-star" data-rating="2"></i>
                  <i class="fas fa-star" data-rating="3"></i>
                  <i class="fas fa-star" data-rating="4"></i>
                  <i class="fas fa-star" data-rating="5"></i>
                </div>
                <input type="hidden" id="review-rating-value" value="0">
              </div>
              <div class="form-group">
                <label for="review-comment">Review Details</label>
                <textarea id="review-comment" rows="5" placeholder="What did you think of this book? Write your feedback here..." required></textarea>
              </div>
              <button type="submit" class="btn btn-primary" style="width: 100%;">Submit Review</button>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Footer -->
  <footer id="main-footer"></footer>

  <!-- Scripts -->
  <script src="/js/utils.js"></script>
  <script src="/js/book-details.js"></script>
</body>
</html>
