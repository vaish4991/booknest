<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Profile — BookNest</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

  <!-- Navigation Bar -->
  <nav id="main-nav" class="navbar"></nav>

  <section class="section" style="max-width: 900px;">
    <h2 class="section-title" style="margin-bottom: 24px;">My Dashboard</h2>

    <div class="cart-container" style="grid-template-columns: 280px 1fr; gap: 32px; align-items: start;">
      
      <!-- Profile Summary Sidebar -->
      <aside style="background-color: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius-md); padding: 24px; box-shadow: var(--shadow-sm); text-align: center;">
        <i class="fas fa-user-circle" style="font-size: 64px; color: var(--text-muted); margin-bottom: 12px;"></i>
        <h3 id="aside-user-name" style="font-size: 18px; font-weight: 700; margin-bottom: 4px;">User Name</h3>
        <p id="aside-user-email" style="font-size: 13px; color: var(--text-muted); margin-bottom: 20px;">email@example.com</p>
        
        <div style="display: flex; flex-direction: column; gap: 10px; border-top: 1px solid var(--border); padding-top: 20px; font-size: 14px; text-align: left;">
          <div><i class="fas fa-shopping-bag" style="color:var(--primary); width:20px;"></i> Total Orders: <span id="profile-total-orders" style="font-weight:700;">0</span></div>
          <div><i class="fas fa-phone" style="color:var(--primary); width:20px;"></i> Mobile: <span id="profile-user-mobile">XXXXXXXXXX</span></div>
        </div>
      </aside>

      <!-- Profile Workspaces -->
      <main style="display: flex; flex-direction: column; gap: 24px;">
        
        <!-- Edit Profile Panel -->
        <div style="background-color: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius-md); padding: 24px; box-shadow: var(--shadow-sm);">
          <h3 style="font-size: 18px; font-weight: 700; margin-bottom: 16px; border-bottom: 1px solid var(--border); padding-bottom: 10px;">Edit Profile</h3>
          
          <form id="edit-profile-form">
            <div class="form-group">
              <label for="profile-name">Full Name</label>
              <input type="text" id="profile-name" required>
            </div>
            <div class="form-group">
              <label for="profile-mobile">Mobile Number</label>
              <input type="tel" id="profile-mobile" pattern="[0-9]{10}" required>
            </div>
            <button type="submit" class="btn btn-primary" style="margin-top: 8px;">Save Changes</button>
          </form>
        </div>

        <!-- Address Management Panel -->
        <div style="background-color: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius-md); padding: 24px; box-shadow: var(--shadow-sm);">
          <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; border-bottom: 1px solid var(--border); padding-bottom: 10px;">
            <h3 style="font-size: 18px; font-weight: 700;">Manage Addresses</h3>
            <button class="btn btn-secondary" id="btn-add-address" style="padding: 6px 12px; font-size: 12px;"><i class="fas fa-plus"></i> Add Address</button>
          </div>
          
          <div id="addresses-list" style="display: flex; flex-direction: column; gap: 12px;">
            <!-- Rendered dynamically -->
          </div>
        </div>

        <!-- Change Password Panel -->
        <div style="background-color: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius-md); padding: 24px; box-shadow: var(--shadow-sm);">
          <h3 style="font-size: 18px; font-weight: 700; margin-bottom: 16px; border-bottom: 1px solid var(--border); padding-bottom: 10px;">Change Password</h3>
          
          <form id="change-password-form">
            <div class="form-group">
              <label for="pass-old">Current Password</label>
              <input type="password" id="pass-old" placeholder="Enter current password" required>
            </div>
            <div class="form-group">
              <label for="pass-new">New Password</label>
              <input type="password" id="pass-new" placeholder="Minimum 6 characters" minlength="6" required>
            </div>
            <div class="form-group">
              <label for="pass-confirm">Confirm New Password</label>
              <input type="password" id="pass-confirm" placeholder="Re-enter new password" minlength="6" required>
            </div>
            <button type="submit" class="btn btn-primary" style="margin-top: 8px;">Update Password</button>
          </form>
        </div>

      </main>

    </div>

    <!-- Add Address Modal -->
    <div id="address-modal" class="modal">
      <div class="modal-content" style="max-width: 500px;">
        <div class="modal-header">
          <h3>Add Shipping Address</h3>
          <button class="modal-close" id="close-address-modal">&times;</button>
        </div>
        <div class="modal-body">
          <form id="add-address-form">
            <div class="form-group">
              <label for="addr-name">Recipient's Full Name</label>
              <input type="text" id="addr-name" required>
            </div>
            <div class="form-group">
              <label for="addr-mobile">Mobile Number</label>
              <input type="tel" id="addr-mobile" pattern="[0-9]{10}" placeholder="10-digit number" required>
            </div>
            <div class="form-group">
              <label for="addr-line">Address Line</label>
              <input type="text" id="addr-line" placeholder="Flat, house no., building, street address" required>
            </div>
            <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px;">
              <div class="form-group">
                <label for="addr-city">City</label>
                <input type="text" id="addr-city" required>
              </div>
              <div class="form-group">
                <label for="addr-state">State</label>
                <input type="text" id="addr-state" required>
              </div>
              <div class="form-group">
                <label for="addr-pincode">Pincode</label>
                <input type="text" id="addr-pincode" pattern="[0-9]{6}" placeholder="6-digit PIN" required>
              </div>
            </div>
            <div class="form-group" style="margin-top:10px;">
              <label class="checkbox-label">
                <input type="checkbox" id="addr-default"> Set as default shipping address
              </label>
            </div>
            <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 10px;">Add Address</button>
          </form>
        </div>
      </div>
    </div>

  </section>

  <!-- Footer -->
  <footer id="main-footer"></footer>

  <!-- Scripts -->
  <script src="/js/utils.js"></script>
  <script src="/js/profile.js"></script>
</body>
</html>
